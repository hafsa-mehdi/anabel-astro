services:
  label: What we do
  heading: Three ways we care for *your rugs*
  intro: >-
    Anabel hand-picks every rug in the showroom, handmade by skilled artisans in
    countries like India, Turkey, Pakistan, Afghanistan and Nepal. Then we keep
    yours clean, and mend it when life happens.
  cards:
    - title: Try before you buy
      text: >-
        Take a rug home with no obligation. Sometimes seeing it in your own room
        is the only way to know. White glove delivery and installation included.
      tag: ''
      image: /images/uploads/home/services/cards/0/image.webp
      imageAlt: >-
        Living room with white sofas, green armchairs and a large blue and white
        patterned rug in front of the fireplace
      link:
        label: Call to schedule a home trial
        url: tel:+15028959595
    - title: Rug cleaning
      text: >-
        Hand-washed with a wool-safe shampoo. No steam, no harsh chemicals, and
        colors tested before we start.
      tag: 15% off
      image: /images/uploads/home/services/cards/1/image.webp
      imageAlt: A technician hand-washing a red oriental rug on the wash floor
      link:
        label: Book cleaning
        url: /louisville-rug-cleaning/
    - title: Expert repair
      text: >-
        Holes and tears, fringe, edges, faded color and water damage, mended by
        hand with matching threads.
      tag: ''
      image: /images/uploads/home/services/cards/2/image.webp
      imageAlt: Hands re-weaving the border of a navy and red oriental rug, with spools of thread beside it
      link:
        label: See repairs
        url: /hole-or-tear-repair/
