seo:
  title: Meet the Team at Anabel's Oriental Rugs | Louisville
  description: >-
    Get to know the people behind Anabel's Oriental Rugs on Frankfort Avenue,
    from Anabel herself to the team who design, deliver and install your rugs.
kicker: About Anabel's
heading: Meet *the team*
story:
  heading: Anabel's *story*
  body: >-
    It all started when I was in search of my own rugs back in 1996. I’ve always
    had an appreciation behind the art that goes in to creating a rug. An
    opportunity arose so I decided to become part of an existing rug store here
    in Louisville. I learned a lot in six years. In 2002, I decided to go on my
    own and never looked back. My goal was to create a rug gallery, where our
    clients felt comfortable shopping and had a positive experience while
    receiving the best customer service! I wanted an inventory that was more
    unique, and special than any other store.


    My philosophy has proven to be a success. In the process, I have met
    incredible people and made some amazing friends, all while helping them find
    what they were looking for. I am thankful every day! The day Anabel’s
    Oriental Rugs feels like work, I will have to move on.
  image: /images/uploads/team/story/image.webp
  imageAlt: Anabel seated among stacked oriental rugs in the showroom, holding her small white dog
membersHeading: The people *behind the rugs*
members:
  - name: Lauren Milliner
    bio: >-
      Anabel’s right-hand woman for over a decade. She works her design magic
      daily, usually behind the scenes, keeping AOR running smoothly as our
      operations manager.
    photo: /images/uploads/team/members/0/photo.webp
    photoAlt: Lauren Milliner in a white blouse, standing in front of a rug
  - name: Dixie Hallenberg
    bio: >-
      With 20 years of retail expertise, she’s our store manager, design
      whisperer and unofficial plant mom, keeping everything on track and very
      much alive.
    photo: /images/uploads/team/members/1/photo.webp
    photoAlt: Dixie Hallenberg in a black blouse, standing in front of a rug
  - name: Elena Dwyer
    bio: >-
      Our trusted design guru. She’s the creative force behind our content, the
      eye behind the lens (and the edits), and the cheerful sidekick you’ll spot
      helping on the sales floor.
    photo: /images/uploads/team/members/2/photo.webp
    photoAlt: Elena Dwyer in a blue shirt, standing in front of a rug
  - name: Emilio Llerena Diaz
    bio: >-
      Our most loyal team member, with 22 years of the rug industry under his
      belt. He’s the expert behind every seamless delivery and flawless install.
    photo: /images/uploads/team/members/3/photo.webp
    photoAlt: Emilio Llerena Diaz in a navy Anabel's polo shirt, standing in front of a rug
  - name: Richard Alejandro Montero
    bio: >-
      Emilio’s trusty sidekick, learning the rug biz one delivery at a time. He’s
      the right-hand man on every install and always up for the heavy lifting.
    photo: /images/uploads/team/members/4/photo.webp
    photoAlt: Richard Alejandro Montero in a navy Anabel's polo shirt, standing in front of a rug
  - name: Chuey
    bio: >-
      Our youngest member of the bunch, he’s famous for napping on the job and
      handing out free cuddles.
    photo: /images/uploads/team/members/5/photo.webp
    photoAlt: Chuey, a small fluffy white dog, sitting on a rolled-up rug
