seo:
  title: Designer Program | Trade Pricing at Anabel's Oriental Rugs
  description: >-
    Designers, architects and stagers: enjoy trade pricing, design support, quick
    fulfillment and new arrivals weekly at Anabel's Oriental Rugs. Apply online.
kicker: For the trade
heading: Designer *program*
intro: >-
  Anabel and her team love to work with designers as they perfect their clients'
  homes.
image: /images/uploads/designers/image.webp
imageAlt: Inside the Anabel's showroom, with rugs hanging on display and layered across the floor
benefitsHeading: Trade *benefits*
benefits:
  - To the Trade pricing
  - >-
    Dedicated Design Support: send your samples and we will place them with
    selected rugs and send you photos for color and pattern reference
  - Ability to source based on desired rug specifications
  - Quick fulfillment on all in-stock orders
  - Friendly return policy
  - New Arrivals weekly
benefitsImage: /images/uploads/designers/benefitsImage.webp
benefitsImageAlt: >-
  Detail of a colorful, intricate Persian rug featuring rich reds, blues, and
  cream with ornate patterns and a fringed edge
form:
  heading: Designer *application*
  intro: >-
    If you are an interior designer, architect, stager, or home developer, apply
    for a designer account with Anabel’s Oriental Rugs! You will receive a
    confirmation email upon approval.
  documentsHelp: >-
    Please upload ONE of the following documents: (1) membership in a major
    design organization (e.g., ASID, IIDA, AIA, NKBA, IDC), (2) interior design
    certification (e.g., NCIDQ, CCIDC), (3) valid business license, or (4) Valid
    EIN or Resale Certificate.
